[project]
name = "jubi"
version = "0.1.0"
description = ""
authors = [{ name = "akliamrous", email = "akliamrous2001@gmail.com" }]
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "click (>=8.4.2,<9.0.0)",
    "pydantic>=2.13.4,<3.0.0",
    "python-dotenv>=1.2.3",
    "pyfiglet>=1.0.4",
]

[project.scripts]
jubi = "jubi.main:cli"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
